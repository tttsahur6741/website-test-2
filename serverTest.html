<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Form</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }

        #message {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            color: #ffffff;
            background-color: #1e1e1e;
            border: 2px solid #333333;
            border-radius: 12px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
        }

        #message::placeholder {
            color: #888888;
        }

        #message:focus {
            border-color: #6200ee;
            background-color: #252525;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background-color: #6200ee;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background-color: #7c4dff;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- 1. FIXED: Added id="discordForm" here so JS can find it -->
    <form id="discordForm">
        <input type="text" id="message" placeholder="Type message for webhook...">
        <button type="submit">Send</button>
    </form>
</body>
<script>
document.getElementById('discordForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  <!-- 2. FIXED: Changed 'userMessage' to 'message' to match the HTML input ID above -->
  const messageText = document.getElementById('message').value;
  const makeWebhookUrl = 'https://hook.us2.make.com/uuoiepq15fdxmkwbyf2sg2jhde6p6nv3';

  <!-- 3. FIXED: Added a try/catch error wrapper so your page doesn't silently break if Make fails -->
  try {
    const response = await fetch(makeWebhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: messageText })
    });
    
    if (response.ok) {
      alert('Sent successfully!');
    } else {
      alert('Make received it but returned an error.');
    }
  } catch (error) {
    console.error(error);
    alert('Failed to send. Make sure Make is actively listening!');
  }
});
</script>
</html>
